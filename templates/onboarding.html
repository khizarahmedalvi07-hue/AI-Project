{% extends "base.html" %}
{% block content %}
<div class="card auth-box">
    <h2>Complete Your Profile</h2>
    <form id="onboarding-form">
        <div class="form-group">
            <label for="age">Age (years)</label>
            <input type="number" id="age" min="12" max="100" value="{{ current_user.age or '' }}" required>
        </div>
        <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" required>
                <option value="male" {% if current_user.gender == 'male' %}selected{% endif %}>Male</option>
                <option value="female" {% if current_user.gender == 'female' %}selected{% endif %}>Female</option>
            </select>
        </div>
        <div class="form-group">
            <label for="height_cm">Height (cm)</label>
            <input type="number" step="0.1" id="height_cm" value="{{ current_user.height_cm or '' }}" required>
        </div>
        <div class="form-group">
            <label for="weight_kg">Current Weight (kg)</label>
            <input type="number" step="0.1" id="weight_kg" value="{{ current_user.weight_kg or '' }}" required>
        </div>
        <div class="form-group">
            <label for="goal">Fitness Goal</label>
            <select id="goal" required>
                <option value="weight_loss" {% if current_user.goal == 'weight_loss' %}selected{% endif %}>Weight Loss (-500 kcal)</option>
                <option value="maintenance" {% if current_user.goal == 'maintenance' %}selected{% endif %}>Maintain Weight</option>
                <option value="muscle_gain" {% if current_user.goal == 'muscle_gain' %}selected{% endif %}>Muscle Gain (+300 kcal)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="gym_access">Gym Access</label>
            <select id="gym_access" required>
                <option value="1" {% if current_user.gym_access %}selected{% endif %}>Yes (Gym Equipment Available)</option>
                <option value="0" {% if not current_user.gym_access %}selected{% endif %}>No (Home / Bodyweight Only)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="activity_level">Activity Level</label>
            <select id="activity_level" required>
                <option value="1.2">Sedentary (Little or no exercise)</option>
                <option value="1.375">Lightly Active (1-3 days/week)</option>
                <option value="1.55">Moderately Active (3-5 days/week)</option>
                <option value="1.725">Very Active (6-7 days/week)</option>
            </select>
        </div>
        <button type="submit" class="btn">Save Profile</button>
    </form>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
