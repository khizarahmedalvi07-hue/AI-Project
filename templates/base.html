<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto Condensed', sans-serif;
        }
        body {
            background-color: #000000;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        nav {
            background-color: #121212;
            border-bottom: 1px solid #252525;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #22c55e;
            letter-spacing: 1px;
        }
        .nav-links a {
            color: #d4d4d4;
            text-decoration: none;
            margin-left: 20px;
            font-size: 1rem;
        }
        .nav-links a:hover {
            color: #22c55e;
        }
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 32px auto;
            padding: 0 20px;
            flex: 1;
        }
        .card {
            background-color: #121212;
            border: 1px solid #252525;
            border-radius: 8px;
            padding: 24px;
        }
        .auth-box {
            max-width: 440px;
            margin: 40px auto;
        }
        h2, h3 {
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #a3a3a3;
            font-size: 0.95rem;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            background-color: #252525;
            border: 1px solid #333333;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #22c55e;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #22c55e;
            color: #000000;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn:hover {
            background-color: #16a34a;
        }
        .alert {
            display: none;
            background-color: #252525;
            border-left: 4px solid #ef4444;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 4px;
            color: #fca5a5;
        }
        .link-text {
            margin-top: 16px;
            text-align: center;
            color: #a3a3a3;
        }
        .link-text a {
            color: #22c55e;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <nav>
        <div class="brand">NUTRISYNC</div>
        <div class="nav-links">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('auth.dashboard_page') }}">Dashboard</a>
                <a href="{{ url_for('auth.onboarding_page') }}">Profile</a>
                <a href="{{ url_for('auth.logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('auth.login_page') }}">Login</a>
                <a href="{{ url_for('auth.signup_page') }}">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        <div id="alert-box" class="alert"></div>
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
